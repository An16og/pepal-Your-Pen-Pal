server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${SERVER_PORT:8080}
spring.application.name=pepal-journal
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/pepal}
spring.datasource.username=${DB_USER:pepal}
spring.datasource.password=${DB_PASSWORD:localjournal}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:qwen2.5:3b}
spring.ai.ollama.embedding.options.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text-v2-moe}
spring.jackson.serialization.write-dates-as-timestamps=false

otto.trash.retention-days=30
otto.trash.purge-cron=0 0 2 * * ?

otto.prompts.max-context-chars=6000
otto.prompts.generation-timeout-seconds=20
otto.prompts.similarity-threshold=0.7
otto.prompts.temperature=0.8
otto.prompts.pregenerate-cron=0 0 5 * * ?

spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
